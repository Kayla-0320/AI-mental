# ============================================================
# 多模态融合配置
# ============================================================

# 加权平均策略权重
weighted_average:
  text_weight: 0.6          # 文本模态权重
  audio_weight: 0.4         # 语音模态权重

# Stacking 策略参数
stacking:
  # 使用 LogisticRegression 作为 meta-learner
  max_iter: 1000
  C: 1.0                    # 正则化强度的倒数
  solver: "lbfgs"

# 动态加权策略参数
dynamic_weighting:
  # 置信度温度参数（softmax 温度）
  temperature: 1.0
  # 最小置信度阈值（低于此值则该模态权重为 0）
  min_confidence: 0.3

# 风险等级阈值
# 来源：参考 PHQ-9 临床分级标准（Kroenke et al., 2001）
# 结合青少年心理健康筛查实践调整
# - 0.0 ~ 0.3: 低风险（正常情绪波动）
# - 0.3 ~ 0.6: 中风险（需要关注，建议轻度干预）
# - 0.6 ~ 0.8: 高风险（建议专业评估）
# - 0.8 ~ 1.0: 危机（立即触发升级流程）
risk_thresholds:
  low: 0.3
  medium: 0.6
  high: 0.8

# 模态缺失降级策略
fallback:
  # 当某一模态缺失时，是否自动降级为单模态
  enabled: true
  # 单模态降级时的置信度衰减系数（单模态不如双模态可靠）
  confidence_decay: 0.85

# ============================================================
# 年龄分层融合配置
# ============================================================
# 基于发展心理学研究，不同年龄段青少年的情绪表达特征不同，
# 因此各模态的融合权重也不同。
#
# 设计原理：
# - 初中生面部掩饰弱 → 面部权重大 (0.25)
# - 大学生掩饰强 → 面部权重低 (0.10)，文本权重高 (0.55)
# - 语音权重各年龄组保持一致 (0.20)
# - 风险阈值偏移：初中=-0.05(更敏感), 大学=+0.05(减少误报)
# ============================================================

age_profiles:
  early_adolescent:  # 12-15岁（初中）
    modality_weights:
      text: 0.40
      audio: 0.20
      face: 0.25
      behavior: 0.15
    risk_threshold_offset: -0.05

  mid_adolescent:    # 15-18岁（高中）
    modality_weights:
      text: 0.50
      audio: 0.20
      face: 0.15
      behavior: 0.15
    risk_threshold_offset: 0.0

  young_adult:       # 18-22岁（大学）
    modality_weights:
      text: 0.55
      audio: 0.20
      face: 0.10
      behavior: 0.15
    risk_threshold_offset: 0.05
