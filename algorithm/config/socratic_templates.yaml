# ============================================================
# 苏格拉底式反问话术模板配置（三级深度 + CBT 5 步绑定）
# ============================================================
# 所有话术均遵循苏格拉底式提问原则：
#   - 不给建议，只引导思考
#   - 不评判，只反映
#   - 不追问，只邀请
#
# 三级深度与 CBT 5 步对应关系：
#   SHALLOW → 步骤1 识别自动思维 / 步骤2 识别认知扭曲
#   MEDIUM  → 步骤3 检验证据 / 步骤4 寻找替代解释
#   DEEP    → 步骤5 评估情绪变化 + 制定行动计划
#
# 临床依据：
#   - Socratic questioning in CBT (Beck, 2011)
#   - 适用于青少年认知重构（Kazdin, 2017）
#   - 青少年适配语言参考：Stallard (2002) Think Good, Feel Good

# ============================================================
# 过渡语：从共情模式切换到苏格拉底模式时使用
# ============================================================
# 设计理由：直接反问会让青少年感到突兀，需要柔和过渡。
transitions:
  - "我听到你说的了。如果你愿意的话，我们可以一起想想——"
  - "你说的让我想到一些东西。你愿意和我一起探索一下吗？"
  - "嗯，我理解你的感受。不知道你有没有想过——"
  - "谢谢你告诉我这些。我想问你一个问题，如果你不想回答也没关系——"

# ============================================================
# 三级反问模板（按深度分级 + CBT 步骤绑定）
# ============================================================
# 深度选择规则：
#   SHALLOW: 情绪刚平复（calm_turns == 2），或基线边缘偏离（|Z| ∈ [1.5, 2.0]）
#   MEDIUM:  情绪稳定（calm_turns >= 3）+ 基线正常（|Z| < 1.5）+ 用户主动探索
#   DEEP:    情绪稳定 + 非危机 + 用户连续 2 轮主动探索（consecutive_exploration >= 2）

questions_by_depth:
  # --------------------------------------------------------
  # SHALLOW 浅层：识别自动思维 + 识别认知扭曲
  # 对应 CBT 步骤 1-2
  # 适用场景：情绪刚平复，用户刚开始愿意探索
  # --------------------------------------------------------
  SHALLOW:
    cbt_steps:
      - step: "identify_thought"
        label: "识别自动思维"
        templates:
          - "刚才那个念头，是突然冒出来的，还是一直在的？"
          - "如果给那个想法起个名字，你会叫它什么？"
          - "你脑海里闪过的第一个想法是什么？"
          - "那个想法出现的时候，你身体有什么感觉？"
      - step: "identify_distortion"
        label: "识别认知扭曲"
        templates:
          - "你觉得这个想法有没有可能是'非黑即白'的思维？"
          - "有没有一种可能，你的大脑在'算命'——直接预测了最坏的结果？"
          - "这个想法里，有没有'应该'或者'必须'这样的词？"
          - "如果好朋友这么想自己，你会觉得 ta 在用什么方式看自己？"

  # --------------------------------------------------------
  # MEDIUM 中层：检验证据 + 寻找替代解释
  # 对应 CBT 步骤 3-4
  # 适用场景：情绪稳定，基线正常，用户主动探索
  # --------------------------------------------------------
  MEDIUM:
    cbt_steps:
      - step: "examine_evidence"
        label: "检验证据"
        templates:
          - "支持这个想法的证据有哪些？反对它的证据呢？"
          - "如果像侦探一样找线索，你会发现什么？"
          - "过去有没有过类似的担心，但最后并没有发生？"
          - "如果让一个了解你的朋友来看这件事，ta 会怎么说？"
      - step: "alternative_thought"
        label: "寻找替代解释"
        templates:
          - "有没有另一种方式来看待这件事？"
          - "如果这件事发生在别人身上，你会怎么解释？"
          - "有没有可能，事情没有你想的那么严重？"
          - "换个角度想，这件事有没有什么好的方面？"

  # --------------------------------------------------------
  # DEEP 深层：评估情绪变化 + 制定行动计划
  # 对应 CBT 步骤 5
  # 适用场景：情绪稳定 + 非危机 + 用户连续 2 轮主动探索
  # --------------------------------------------------------
  DEEP:
    cbt_steps:
      - step: "evaluate_emotion_change"
        label: "评估情绪变化"
        templates:
          - "现在回头看那个想法，你的感受有变化吗？从 1 到 10 分，现在有多难受？"
          - "刚才和现在相比，心情有什么不一样？"
          - "如果之前的想法是一团乌云，现在那团云还在吗？"
          - "你觉得刚才的探索，对你有帮助吗？"
      - step: "action_plan"
        label: "制定行动计划"
        templates:
          - "如果今天做一件小事来让自己感觉好一点，会是什么？"
          - "下次那个想法再出现的时候，你想怎么应对？"
          - "有没有一个你信任的人，可以聊聊这件事？"
          - "如果一周后再回看今天，你希望自己能记住什么？"

# ============================================================
# 旧版 questions 字段（保留兼容）
# ============================================================
questions:
  cognitive_restructuring:
    - "这个想法是从什么时候开始的？"
    - "如果好朋友遇到同样的事，你会怎么对 ta 说？"
    - "有没有可能，事情还有另一个角度？"
    - "如果 1 到 10 分，这件事有多严重？"
  behavioral_experiment:
    - "如果试一种不同的方式，你觉得会怎样？"
    - "过去有没有类似的经历？当时是怎么度过的？"
    - "如果今天做一件小事来改变现状，会是什么？"
  decatastrophizing:
    - "最坏的情况是什么？如果真的发生了，你能怎么办？"
    - "一年后回头看，这件事还重要吗？"
    - "有没有比这更糟的情况？你是怎么应对那些的？"
  values_clarification:
    - "对你来说，最重要的是什么？"
    - "如果没有任何限制，你最想成为什么样的人？"
    - "这件事和你的目标有什么关系？"

# ============================================================
# 回避时的共情回复模板
# ============================================================
# 用户回避反问时，不继续追问，而是退回共情模式。
# 临床依据：青少年在情绪未平复时，追问会引发抵触和烦躁。
avoidance_responses:
  - "没关系，我们换个方式聊聊。你现在最想说的是什么？"
  - "不想回答就不回答。我在这里陪着你，你想聊什么都可以。"
  - "好的，我们不聊这个了。你今天过得怎么样？"
  - "理解，有时候不想说就不说。我就在这里，等你准备好了再聊。"

# ============================================================
# 模式退回时的过渡语
# ============================================================
# 从苏格拉底模式退回共情模式时使用。
mode_fallback_transitions:
  - "我们换个方式聊聊吧。"
  - "不急，慢慢来。"
  - "先不想了，我陪你待一会儿。"

# ============================================================
# 深度降级过渡语
# ============================================================
# 当深度从 DEEP/MEDIUM 降级到 SHALLOW/EMPATHY 时使用。
# 设计理由：降级过程需要过渡语，不要突兀切换。
depth_downgrade_transitions:
  DEEP_TO_MEDIUM:
    - "我们慢慢来，不着急。"
    - "先回到刚才那个想法，再仔细看看。"
  MEDIUM_TO_SHALLOW:
    - "没关系，我们换个角度想想。"
    - "先不急着下结论，再看看。"
  ANY_TO_EMPATHY:
    - "不想聊这个也没关系，我陪你待一会儿。"
    - "我们换个话题吧，你现在最想说什么？"
    - "好的，先不想了。我在这里陪着你。"

# ============================================================
# 审计配置：苏格拉底反问时机审计（第六轴）
# ============================================================
# 与 auditor.py 中的 socratic_timing 轴配合使用。
audit:
  # 用户连续回避次数阈值，超过后自动退回共情模式
  max_consecutive_avoidance: 2
  # 情绪未平复时禁止触发反问（连续 calm turns 最低要求）
  min_calm_turns: 2
  # 基线 Z-score 阈值，超过时禁止触发反问
  max_abs_z_score: 2.0
  # 危机状态下禁止触发反问
  block_in_crisis: true
  # 回避后深度冻结轮次（降级后至少 3 轮保持 SHALLOW）
  depth_freeze_turns_after_avoidance: 3

# ============================================================
# CBT 认知重构记录模板
# ============================================================
# 对话结束时，如果走过完整 DEEP 流程，生成结构化记录。
cbt_record:
  title: "这次聊天的收获"
  sections:
    - key: "automatic_thought"
      label: "🧠 你发现的自动思维"
      placeholder: "（AI 会根据对话内容总结）"
    - key: "distortion_type"
      label: "🔍 认知扭曲类型"
      placeholder: "（识别出的扭曲模式）"
    - key: "evidence_for"
      label: "✅ 支持证据"
      placeholder: "（找到的支持证据）"
    - key: "evidence_against"
      label: "❌ 反对证据"
      placeholder: "（找到的反对证据）"
    - key: "alternative_thought"
      label: "💡 替代想法"
      placeholder: "（一起想出的新角度）"
    - key: "emotion_change"
      label: "📊 情绪变化"
      placeholder: "（从 X 分降到 Y 分）"
    - key: "action_plan"
      label: "🎯 下一步行动"
      placeholder: "（一起制定的小计划）"
