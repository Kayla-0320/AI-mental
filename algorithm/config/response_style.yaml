# ============================================================
# AI 回复风格配置（节奏匹配）
# ============================================================
# 根据用户表达风格动态调整回复节奏。
# 四种风格对应不同的回复策略，让 AI 适应用户而非用户适应 AI。
#
# ⚠️ 注意：本文件是**风格规范文档**，不直接被代码加载。
# 实际风格参数由 `intervention/style_detector.py` 的 `get_reply_style_params()` 返回。
# 本文件用于记录设计意图和风格描述，供维护者参考。
#
# 设计依据：
#   - 动机式访谈 (MI)：跟随来访者节奏
#   - 青少年沟通差异：内向者需要空间，外向者需要互动
#   - 不匹配的节奏 → 压迫感（内向）或敷衍感（外向）
#
# ⚠️ 去模板化说明：
#   旧版每种风格都有固定 templates 列表（"我在这里陪着你""慢慢来"等），
#   模型倾向于直接搬用这些句子，导致回复千篇一律。
#   改为 style_hints（风格描述），让模型自己组织语言，而不是从列表里挑。

# ============================================================
# INTROVERTED 内向型
# ============================================================
# 用户特征：短消息、少标点、少提问、多省略号
# 回复策略：短回复、少提问、多陪伴、给空间
INTROVERTED:
  label: "温柔陪伴"
  description: "用户倾向于简短表达，需要更多空间和陪伴"

  reply_constraints:
    max_length: 30
    min_length: 8
    should_ask_question: false
    question_count: 0

  tone:
    primary: "gentle"
    secondary: "warm"

  content_rules:
    include_companionship: true
    include_guidance: false
    include_validation: true
    include_emoji: false

  # 风格提示（不是固定台词！模型应据此自己组织语言）
  style_hints:
    companionship: "让对方知道你在，不用解释为什么"
    validation: "传达'不急'的感觉，让对方按自己的节奏来"
    presence: "用最短的话传达'我在这里'——嗯、在呢、我听着"

  transition_hints:
    to_empathy: "自然地接住对方的情绪，不急着往下走"
    to_guidance: null  # 内向型不主动引导

# ============================================================
# EXTROVERTED 外向型
# ============================================================
# 用户特征：长消息、多标点、多提问、高情绪表达
# 回复策略：长回复、多提问、多互动、多回应
EXTROVERTED:
  label: "积极互动"
  description: "用户倾向于详细表达，需要更多互动和回应"

  reply_constraints:
    max_length: 80
    min_length: 20
    should_ask_question: true
    question_count: 2

  tone:
    primary: "energetic"
    secondary: "warm"

  content_rules:
    include_companionship: true
    include_guidance: true
    include_validation: true
    include_emoji: true

  style_hints:
    companionship: "让对方感到你在认真听、对ta说的感兴趣"
    interaction: "顺着对方说的内容追问，表示你想了解更多"
    energy: "语气可以活泼一点，像跟好朋友打电话"

  transition_hints:
    to_empathy: "先回应对方说的具体内容，再表达你的感受"
    to_guidance: "在对方说的基础上自然延伸，不要突然换方向"

# ============================================================
# AGITATED 激动型
# ============================================================
# 用户特征：极短/极快消息、高情绪强度、多感叹号
# 回复策略：极短回复、情绪反映为主、不提问、先稳定
AGITATED:
  label: "情绪稳定优先"
  description: "用户情绪激动，需要先稳定情绪再深入"

  reply_constraints:
    max_length: 20
    min_length: 5
    should_ask_question: false
    question_count: 0

  tone:
    primary: "warm"
    secondary: "calm"

  content_rules:
    include_companionship: true
    include_guidance: false
    include_validation: true
    include_emoji: false

  style_hints:
    stabilization: "传达'你安全、我在'的感觉，不要刺激对方"
    validation: "承认对方的感受是真实的、重要的，不说'别想了'"
    presence: "最短的话传达最重的陪伴——'我在''我陪着你'"

  transition_hints:
    to_empathy: "先稳定，不急着往下走"
    to_guidance: null  # 激动型不引导

# ============================================================
# CALM 平稳型
# ============================================================
# 用户特征：中等长度、正常标点、情绪稳定
# 回复策略：正常节奏、可引入引导
CALM:
  label: "平稳引导"
  description: "用户表达平稳，可以正常节奏交流并引入引导"

  reply_constraints:
    max_length: 50
    min_length: 15
    should_ask_question: true
    question_count: 1

  tone:
    primary: "calm"
    secondary: "warm"

  content_rules:
    include_companionship: true
    include_guidance: true
    include_validation: true
    include_emoji: true

  style_hints:
    companionship: "自然回应对方说的内容，让对方感到被听到"
    guidance: "顺着对方的话题自然延伸，不要突然换方向"
    rhythm: "像正常朋友聊天：有回应、有追问、有自己的感受"

  transition_hints:
    to_empathy: "先回应具体内容，再表达你的感受"
    to_guidance: "在对方说的基础上自然延伸"

# ============================================================
# 风格切换过渡提示
# ============================================================
# 当检测到用户风格变化时的过渡方向
style_transition:
  calm_to_agitated: "感受到对方情绪变强了，先稳定，不追问"
  agitated_to_calm: "对方平静了一些，可以慢慢聊，但不急着深入"
  any_to_introverted: "对方话变少了，给空间，不追问"
  any_to_extroverted: "对方想多聊，接得活一点，多回应"
